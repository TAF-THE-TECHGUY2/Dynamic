<meta charset="utf-8">
<style>
  @font-face{font-family:'Archivo Black';src:url('/fonts/archivo-black-400-latin.woff2') format('woff2');font-weight:400}
  @font-face{font-family:'Barlow';src:url('/fonts/barlow-700-latin.woff2') format('woff2');font-weight:700}
  @font-face{font-family:'JetBrains Mono';src:url('/fonts/jetbrains-mono-700-latin.woff2') format('woff2');font-weight:700}
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#111111;color:#fff;position:relative;overflow:hidden;
       font-family:'Barlow',sans-serif}
  .diag{position:absolute;top:-120px;right:-200px;width:620px;height:900px;background:#E01C1C;
        transform:skewX(-16deg);opacity:.16}
  .wrap{position:relative;padding:74px 80px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:16px}
  .mark{font-family:'Archivo Black';font-size:60px;transform:skewX(-10deg);letter-spacing:-.05em;line-height:.9}
  .mark .d{color:#E01C1C}
  .slash{background:#E01C1C;transform:skewX(-16deg);width:9px;height:50px}
  .w1{font-family:'Archivo Black';font-size:34px;line-height:1}
  .w2{font-weight:600;letter-spacing:.4em;font-size:15px;margin-top:4px}
  h1{font-family:'Archivo Black';font-size:104px;line-height:.9;letter-spacing:-.02em}
  h1 span{color:#E01C1C}
  .eyebrow{font-weight:700;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:#E01C1C;margin-bottom:14px}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;
        border-top:5px solid #E01C1C;padding-top:22px}
  .foot .t{font-family:'Archivo Black';font-size:19px;letter-spacing:.13em}
  .foot .t em{font-style:normal;color:#E01C1C}
  .foot .n{font-family:'JetBrains Mono';font-weight:700;font-size:26px}
</style>
<div class="diag"></div>
<div class="wrap">
  <div class="logo">
    <div class="mark"><span class="d">D</span><span>S</span></div>
    <div class="slash"></div>
    <div><div class="w1">DYNAMIC</div><div class="w2">SOLUTIONS</div></div>
  </div>
  <div>
    <div class="eyebrow">Bulk supply &middot; Benoni, Gauteng</div>
    <h1>DIESEL<br><span>AVAILABLE</span></h1>
  </div>
  <div class="foot">
    <div class="t">TRUSTED FUEL. <em>DRIVEN BY SERVICE.</em></div>
    <div class="n">061 687 4334</div>
  </div>
</div>
