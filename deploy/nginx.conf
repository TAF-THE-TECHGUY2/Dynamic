# Dynamic Solutions — nginx vhost.
#
# provision.sh substitutes __APP_DIR__ and __PHP_VERSION__ and writes this to
# /etc/nginx/sites-available/dynamic. certbot rewrites the server block for TLS
# once DNS resolves.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root __APP_DIR__/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Compression. Lighthouse marks the site down without it, and the CSS
    # bundle goes from 112KB to 19KB.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff2;

    # Built assets and self-hosted fonts are content-hashed or stable, so they
    # can be cached hard. Everything else is dynamic.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Browsershot can take a few seconds on a small instance.
        fastcgi_read_timeout 120;
    }

    # Never serve dotfiles — .env above all.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/dynamic-access.log;
    error_log  /var/log/nginx/dynamic-error.log;
}
